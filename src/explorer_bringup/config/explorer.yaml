# Parameters for every node of the demo, in one file.
#
# The top-level keys are NODE NAMES. Each node only reads its own section, so the same
# file can be handed to all of them (see the launch files).
#
# Every node also has defaults in its source code. This file lists the values worth
# knowing about and playing with, not all of them:
#
#   ros2 param list /explorer          every parameter the node has
#   ros2 param describe /sim lidar_noise
#
# After editing this file: `pixi run -e jazzy build --packages-select explorer_bringup`
# (the launch files read the installed copy), then start the demo again.

sim:
  ros__parameters:
    width: 1280            # the simulator window, in pixels. Smaller is faster
    height: 720
    sensor_rate: 10.0      # lidar scans and camera frames per second
    odom_rate: 30.0        # odometry and tf samples per second
    lidar_beams: 360
    lidar_range: 8.0       # m. Try 3.0: the robot has to get much closer to see anything
    lidar_noise: 0.01      # m, standard deviation. Can be changed while running
    odom_drift: 0.0        # 0 = perfect odometry. Try 1.0 and watch the map smear
    camera_width: 640
    camera_height: 360
    camera_fov: 50.0       # degrees, vertical
    jpeg_quality: 80

safety_monitor:
  ros__parameters:
    robot_radius: 0.22     # m
    lateral_margin: 0.04   # m of extra width on each side of the strip that is checked
    stop_clearance: 0.10   # m of free floor ahead at which forward motion is cut to zero
    slow_clearance: 0.50   # m of free floor ahead at which slowing down begins
    scan_timeout: 0.5      # s without a scan before the robot is held still

mapper:
  ros__parameters:
    resolution: 0.1        # m per grid cell. 0.05 gives a finer map and four times the work
    # The grid is a fixed rectangle in the map frame. It must cover the building,
    # which spans x -2..24 and y -8..8 with the robot starting at the origin.
    origin_x: -4.0
    origin_y: -10.0
    width_m: 30.0
    height_m: 20.0
    publish_rate: 2.0      # Hz

explorer:
  ros__parameters:
    robot_radius: 0.22
    inflation_margin: 0.14    # m kept between the robot's edge and anything in the map
    min_frontier_size: 8      # cells. Smaller frontiers are ignored as noise
    replan_period: 1.0        # s
    max_linear_speed: 0.6     # m/s. The simulator's own limit is 0.8
    max_angular_speed: 1.5    # rad/s
    lookahead: 0.5            # m, how far ahead on the path the robot aims

cone_spotter:
  ros__parameters:
    max_range: 5.0         # m. Cones farther away are detected but not placed on the map
    confirmations: 3       # sightings needed before a cone counts
    merge_radius: 0.6      # m. Sightings closer than this are the same cone

dashboard:
  ros__parameters:
    width: 1280
    height: 720
    return_home: true      # drive back to the start when the exploration is finished

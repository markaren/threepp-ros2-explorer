# Parameters for Nav2, when it takes over planning and driving from our own explorer:
#
#   ros2 launch explorer_bringup demo.launch.py navigation:=nav2
#
# Four Nav2 nodes are started, and each reads its own section of this file:
#
#   planner_server      a path from here to the goal, on the global costmap
#   controller_server   velocity commands that follow that path, on the local costmap
#   behavior_server     what to do when stuck: spin, back up, wait
#   bt_navigator        the behaviour tree that calls the other three in the right order,
#                       and the `navigate_to_pose` action our explorer sends its goals to
#
# The values are Nav2's documented defaults (https://docs.nav2.org/configuration) with
# this robot filled in. Lines that say "ours" hold a number that also exists in
# explorer.yaml, for the node that Nav2 replaces: change both, or compare the two.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # No behaviour tree is named here, so Nav2's default is used:
    # navigate_to_pose_w_replanning_and_recovery.xml (plan again once a second, and on
    # failure clear the costmaps, spin, wait, back up, in turn). It is an XML file in
    # share/nav2_bt_navigator/behavior_trees, and worth opening.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn spreads a wave over the costmap and walks back down it, like our own
      # planner.py. It spreads from the goal, ours from the robot.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5            # m. A goal that is blocked may be replaced by a free spot this close
      use_astar: false
      allow_unknown: false      # never plan through cells nobody has seen

controller_server:
  ros__parameters:
    controller_frequency: 20.0  # ours: control_rate
    odom_topic: odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25    # ours: the explorer calls the robot stuck when it
      movement_time_allowance: 6.0      # has not moved 0.25 m in stuck_timeout seconds
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.12   # ours: goal_tolerance
      yaw_goal_tolerance: 0.25
    FollowPath:
      # Regulated Pure Pursuit: the algorithm of our pure_pursuit.py, with rules added for
      # slowing down in curves and near obstacles.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6           # ours: max_linear_speed
      lookahead_dist: 0.5               # ours: lookahead
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 1.5    # ours: max_angular_speed
      max_angular_accel: 3.2
      transform_tolerance: 0.3          # changed from 0.1 s: how long to wait for the robot's pose in the map.
                                        # slam_toolbox handles no scan while it redraws its map, map -> odom
                                        # then falls up to a quarter of a second behind, and with 0.1 s the
                                        # controller gave up its goal every few seconds
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# The costmaps. A costmap is Nav2's picture of where the robot may be: layers are added
# on top of each other, and the last one grows every obstacle by the robot's radius.
# The planner owns the global one, the controller the local one. Their sections are
# nested twice because each costmap is a node of its own inside its server.

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      robot_radius: 0.22            # ours: robot_radius
      track_unknown_space: true     # keep "never seen" apart from "free"
      lethal_cost_threshold: 50     # ours: occupied_threshold. Our mapper publishes a probability
                                    # in percent; Nav2's default calls only 100 an obstacle
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        # The map topic. It may come from our mapper or from slam_toolbox, and it may grow.
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        # The scan on top of it, for what the map does not show yet (a crate dropped a
        # moment ago).
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true        # a beam that came back with +inf hit nothing: clear along it
          obstacle_max_range: 7.5
          raytrace_max_range: 8.0   # the lidar_range of the simulator
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6       # ours: robot_radius + inflation_margin + the comfort band
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true          # a 4 m square that travels with the robot
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 7.5
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

lifecycle_manager_navigation:
  ros__parameters:
    # Nav2's nodes are lifecycle nodes: they start unconfigured and do nothing until
    # somebody configures and activates them. This manager does that, in this order.
    autostart: true
    node_names: ["planner_server", "controller_server", "behavior_server", "bt_navigator"]
    bond_timeout: 4.0
